name: Update Proposals

on:
  schedule:
    - cron: "0 0 * * *" # Run daily at midnight UTC
  workflow_dispatch: # Allow manual trigger
    inputs:
      full_refresh:
        description: "Rewrite every proposal, even when its sha is unchanged (use after changing ingestion parsing)"
        type: boolean
        default: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run proposal ingestion
        env:
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FULL_REFRESH: ${{ inputs.full_refresh }}
        # Unchanged proposals (same sha as in Convex) are skipped, so a normal run only writes what changed.
        run: |
          if [ "$FULL_REFRESH" = "true" ]; then
            npx tsx scripts/ingest_proposals.ts --download
          else
            npx tsx scripts/ingest_proposals.ts
          fi
